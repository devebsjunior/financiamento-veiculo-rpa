apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-creds
type: Opaque
stringData:
  # Cole aqui o resultado do comando 'openssl rand -base64 32'
  cookie-secret: "COLE_AQUI_A_CHAVE_DO_PASSO_1"
  # Cole aqui o Client ID gerado no GitHub
  client-id: "COLE_AQUI_O_CLIENT_ID"
  # Cole aqui o Client Secret gerado no GitHub
  client-secret: "COLE_AQUI_O_CLIENT_SECRET"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  labels:
    app: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:latest
        args:
        - --provider=github
        - --email-domain=* # Permite que qualquer usuário autenticado no GitHub acesse
        - --upstream=file:///dev/null
        - --http-address=0.0.0.0:4180
        ports:
        - containerPort: 4180
          protocol: TCP
        env:
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-creds
              key: cookie-secret
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-creds
              key: client-id
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-creds
              key: client-secret
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-service
spec:
  ports:
  - name: http
    port: 4180
    protocol: TCP
    targetPort: 4180
  selector:
    app: oauth2-proxy
